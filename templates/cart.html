<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 My Cart - Scientific Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cart.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
  <script src="{{ url_for('static', filename='animation.js') }}" defer></script>
</head>

<body onload="renderCart()">
  <canvas id="atomCanvas"></canvas>
  <header>
    <nav>
      <div class="logo">LabEquip</div>
      <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('products') }}">Products</a></li>
        <li><a href="{{ url_for('chemicals') }}">Chemicals</a></li>
        <li><a href="{{ url_for('civil') }}">Civil</a></li>
        <li><a href="{{ url_for('services') }}">Services</a></li>
        <li><a href="{{ url_for('contacts') }}">Contact</a></li>
        <li><a href="{{ url_for('cart') }}" class="active">🛒 Cart (<span id="cart-count">0</span>)</a></li>
        <li><a href="{{ url_for('profile') }}">Profile</a></li>
      </ul>
    </nav>
  </header>

  <div class="cart-container">
    <div id="cart-items"></div>
    <div class="summary">
      <h2>Total: <span id="total-price">₹0</span></h2>
      <div class="summary-buttons">
        <a href="{{ url_for('products') }}" class="goto-cart">More Products</a>
        <a href="{{ url_for('chemicals') }}" class="goto-cart">More Chemicals</a>
        <a href="{{ url_for('civil') }}" class="goto-cart">More Civil Instruments</a>
        <button class="clear-cart" onclick="clearCart()">Clear Cart</button>
        <a href="{{ url_for('buy_now') }}" class="buy-now" onclick="buyNow()">Buy Now</a>
      </div>
    </div>
  </div>


  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderCart() {
      const container = document.getElementById("cart-items");
      const totalElement = document.getElementById("total-price");
      container.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = "<p class='empty'>Your cart is empty 🛍️</p>";
        totalElement.textContent = "₹0";
        return;
      }

      let total = 0;

      cart.forEach((item, index) => {
        total += item.price * item.quantity;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="info">
            <h3>${item.name}</h3>
            <p>Price: ₹${item.price}</p>
            <div class="qty">
              <button onclick="changeQty(${index}, -1)">−</button>
              <span>${item.quantity}</span>
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
          </div>
          <button class="remove" onclick="removeItem(${index})">Remove</button>
        `;
        container.appendChild(div);
      });

      totalElement.textContent = `₹${total}`;
      localStorage.setItem("cart", JSON.stringify(cart));
      // You might need to add an element with id="cart-count" to your nav bar for this to work
      // updateCartCount(); 
    }

    /* You can remove updateCartCount if you don't have a cart count element
    function updateCartCount() {
      document.getElementById("cart-count").textContent = cart.reduce((sum, i) => sum + i.quantity, 0);
    }
    */

    function changeQty(index, delta) {
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    // ==========================================================
    // == UPDATED FUNCTION WITH LOGIN REDIRECT + SERVER RESPONSE ==
    // ==========================================================
    async function buyNow() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      // Check if user is logged in using Flask session
      const isLoggedIn = {{ 'true' if session.get('username') else 'false'
    }};

    if (!isLoggedIn) {
      // Redirect to login page and return to cart after login
      window.location.href = "{{ url_for('login', next=url_for('cart')) }}";
      return;
    }

    try {
      const response = await fetch("{{ url_for('place_order') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cart })
      });

      const data = await response.json();

      if (data.success) {
        clearCart();
        alert("✅ Thank you! Your order has been placed successfully.");
        window.location.href = "{{ url_for('orders') }}";
      } else if (data.redirect) {
        // In case backend sends redirect (user not logged in)
        window.location.href = data.redirect;
      } else {
        alert(`❌ Error: ${data.message || data.error}`);
      }
    } catch (error) {
      console.error("Error placing order:", error);
      alert("❌ A network error occurred. Please check your connection and try again.");
    }
  }

  </script>

</body>

</html>
