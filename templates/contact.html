<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - LabEquip</title>
  <style>
    body {
      margin: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .contact-modal {
      background: #fff;
      width: 400px;
      padding: 30px;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      animation: popup 0.3s ease;
    }

    @keyframes popup {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 15px;
      font-size: 20px;
      cursor: pointer;
      color: white;
    }

    .contact-modal h2 {
      text-align: center;
      color: white;
      margin-bottom: 10px;
    }

    .contact-modal p {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      background: #fff;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #fff;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #1fb6ff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0f98d3;
    }
  </style>
</head>

<body>

<div class="contact-modal">
  <span class="close-btn" onclick="closeModal()">✖</span>
  <h2>Contact Us</h2>
  <p>We’d love to hear from you</p>

  <form method="POST" action="{{ url_for('contacts') }}">
    <div class="form-group">
      <input type="text" name="Username" placeholder="Username" required>
    </div>

    <div class="form-group">
      <input type="email" name="Email" placeholder="Email" required>
    </div>

    <div class="form-group">
      <textarea name="message" placeholder="Your message" rows="4" required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>
</div>

<script>
  function closeModal() {
    window.history.back(); 
  }
</script>

</body>
</html>
